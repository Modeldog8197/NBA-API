services:
  - type: web
    name: nba-api-modeldog8197
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn nba_app.api:create_app --factory --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NBA_CORS_ORIGINS
        value: https://modeldog8197.github.io
      - key: NBA_LOCAL_PLAYER_MODELS
        value: "false"
      - key: NBA_TRAINING_ENABLED
        value: "true"
      - key: NBA_TRAINING_API_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
