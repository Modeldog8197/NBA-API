name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Package the dashboard
        env:
          NBA_API_URL: ${{ vars.NBA_API_URL }}
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
