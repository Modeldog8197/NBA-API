name: Deploy Player Lab to Pages

on:
  push:
    branches: [main]
    paths:
      - 'player-lab/**'
      - 'static/**'
      - 'models/**/metadata.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Validate archived player and shot data
        working-directory: player-lab
        run: npm test
      - name: Package the complete Player Lab
        working-directory: player-lab
        env:
          NBA_API_URL: ${{ vars.NBA_API_URL }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Player Lab
        id: deployment
        uses: actions/deploy-pages@v4
