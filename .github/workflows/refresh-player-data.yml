name: Refresh NBA player data snapshot

on:
  workflow_dispatch:
    inputs:
      include_playoffs:
        description: Include playoff game logs and season totals
        type: boolean
        default: true
  schedule:
    # Best-effort refresh; NBA Stats may rate-limit or block hosted runners.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: nba-player-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install "nba_api>=1.9,<2" "pandas>=2.2,<3" -r requirements.txt
      - name: Ingest latest ten seasons
        env:
          NBA_PLAYER_DB: data/nba_players.sqlite3
        run: |
          ARGS="--seasons 10"
          if [ "${{ github.event.inputs.include_playoffs }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --include-playoffs"
          fi
          python -m scripts.ingest_player_data $ARGS
      - name: Upload database snapshot
        if: always() && hashFiles('data/nba_players.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-data-${{ github.run_number }}
          path: data/nba_players.sqlite3
          retention-days: 14
