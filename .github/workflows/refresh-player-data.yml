name: Refresh NBA player data

on:
  workflow_dispatch:
    inputs:
      include_playoffs:
        description: Include playoff game logs and season totals
        type: boolean
        default: true
  schedule:
    # NBA endpoints may block hosted runners. Treat this as best-effort refresh, not a live feed.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: nba-player-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ingestion dependencies
        run: python -m pip install "nba_api>=1.9,<2" "pandas>=2.2,<3" -r requirements.txt
      - name: Ingest latest season
        env:
          NBA_PLAYER_DB: data/nba_players.sqlite3
        run: |
          python - <<'PY'
          import logging, time
          from nba_app.player_data import ingest_season, ingest_season_totals, seasons_to_fetch, sync_player_registry
          logging.basicConfig(level=logging.INFO)
          sync_player_registry()
          season = seasons_to_fetch(1)[0]
          for kind in ("Regular Season", "Playoffs"):
              for fn in (ingest_season, ingest_season_totals):
                  try:
                      fn(season, kind)
                  except Exception as exc:
                      logging.warning("Best-effort refresh failed for %s %s: %s", season, kind, exc)
                  time.sleep(2)
          PY
      - name: Commit changed database if present
        run: |
          if [ -f data/nba_players.sqlite3 ]; then
            git add data/nba_players.sqlite3
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: refresh cached NBA player data"
              git push
            fi
          fi
